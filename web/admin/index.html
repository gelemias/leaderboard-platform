<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Admin sign in</title>
		<style>
			:root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0a0f1f; color: #f3f5ff; }
			body { margin: 0; padding: 32px 18px; }
			main { max-width: 760px; margin: 0 auto; }
			.card { background: #121a30; border: 1px solid #273452; border-radius: 18px; padding: 24px; box-shadow: 0 18px 50px #02040b66; }
			h1 { margin: 0 0 8px; font-size: 28px; }
			p { color: #aeb9d5; line-height: 1.5; }
			form { display: grid; gap: 14px; margin-top: 22px; }
			label { display: grid; gap: 7px; color: #cbd4ec; font-size: 14px; }
			input, textarea, select { width: 100%; box-sizing: border-box; border: 1px solid #344363; border-radius: 9px; background: #0d1426; color: #f3f5ff; padding: 11px 12px; font: inherit; }
			textarea { min-height: 110px; resize: vertical; }
			button { border: 0; border-radius: 9px; padding: 12px 16px; background: #7c8cff; color: #071022; font-weight: 700; cursor: pointer; }
			button:disabled { opacity: .55; cursor: wait; }
			.error { color: #ff9d9d; }
			.success { color: #9ff0c4; }
			.hint { font-size: 13px; }
			.secondary { background: #263555; color: #e8edff; }
			.target-toolbar { display: flex; gap: 8px; align-items: end; }
			.target-toolbar label { flex: 1; }
			.player-list { display: grid; gap: 7px; max-height: 280px; overflow: auto; padding: 8px; border: 1px solid #273452; border-radius: 10px; background: #0d1426; }
			.player-option { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 7px; background: #121a30; }
			.player-option input { width: auto; }
			.player-copy { display: grid; gap: 2px; min-width: 0; }
			.player-name { color: #f3f5ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.player-meta { color: #8997b8; font-size: 12px; }
			.player-empty { color: #8997b8; padding: 8px; }
			.target-summary { margin: 0; color: #aeb9d5; font-size: 13px; }
		</style>
	</head>
	<body>
		<main id="admin-root">
			<section class="card">
				<h1>Sign in</h1>
				<p>Enter your administrator credential to continue.</p>
				<form id="login-form">
					<label>Access token<input id="login-token" type="password" autocomplete="off" required /></label>
					<button id="login" type="submit">Continue</button>
				</form>
				<p id="login-status" class="hint" role="status"></p>
			</section>
		</main>
		<script type="module" src="/admin/admin.js"></script>
	</body>
</html>
