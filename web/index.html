<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0f1f" />
		<title>Leaderboard Arcade</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body>
		<div class="shell">
			<header class="hero">
				<div>
					<p class="eyebrow">LEADERBOARD PLATFORM</p>
					<h1>Every game. One scoreboard.</h1>
					<p class="lede">Live rankings from the games connected to this platform.</p>
				</div>
				<button class="refresh-button" id="refresh" type="button">Refresh scores</button>
			</header>

			<div class="toolbar" aria-live="polite">
				<span class="status-dot"></span>
				<span id="status">Loading games…</span>
			</div>

			<main id="games" class="games" aria-live="polite">
				<div class="loading-card">Loading the game catalog…</div>
			</main>

			<footer>Scores are shown from accepted leaderboard submissions.</footer>
		</div>
		<script type="module" src="/app.js"></script>
	</body>
</html>
